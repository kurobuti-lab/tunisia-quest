// Typewriter text component
function TypeWriter({ text, speed = 40, onComplete, style, delay = 0 }) {
  const [displayed, setDisplayed] = useState("");
  const [started, setStarted] = useState(false);

  useEffect(() => {
    const delayTimer = setTimeout(() => setStarted(true), delay);
    return () => clearTimeout(delayTimer);
  }, [delay]);

  useEffect(() => {
    if (!started) return;
    if (displayed.length < text.length) {
      const timer = setTimeout(() => {
        setDisplayed(text.slice(0, displayed.length + 1));
      }, speed);
      return () => clearTimeout(timer);
    } else {
      onComplete?.();
    }
  }, [displayed, text, speed, started, onComplete]);

  return <span style={style}>{displayed}<span style={{ opacity: displayed.length < text.length ? 1 : 0, animation: "blink 0.5s infinite" }}>▼</span></span>;
}

// DQ-style window frame
function DQWindow({ children, style, title, animate = true }) {
  const [visible, setVisible] = useState(!animate);

  useEffect(() => {
    if (animate) {
      const t = setTimeout(() => setVisible(true), 200);
      return () => clearTimeout(t);
    }
  }, [animate]);

  return (
    <div
      style={{
        border: `3px solid ${COLORS.windowBorder}`,
        borderRadius: "12px",
        background: COLORS.windowBg,
        padding: "16px 20px",
        position: "relative",
        boxShadow: `inset 0 0 0 2px ${COLORS.windowBorderInner}, 0 4px 20px ${COLORS.shadow}`,
        opacity: visible ? 1 : 0,
        transform: visible ? "scale(1)" : "scale(0.8)",
        transition: "all 0.3s ease-out",
        ...style,
      }}
    >
      {title && (
        <div style={{
          position: "absolute",
          top: "-10px",
          left: "16px",
          background: COLORS.windowBg,
          padding: "0 8px",
          fontSize: "10px",
          color: COLORS.textGold,
          fontFamily: PIXEL_FONT,
          letterSpacing: "2px",
        }}>
          {title}
        </div>
      )}
      {children}
    </div>
  );
}

// Pixel art flame
function PixelFlame({ size = 80 }) {
  const [frame, setFrame] = useState(0);
  useEffect(() => {
    const interval = setInterval(() => setFrame(f => (f + 1) % 3), 200);
    return () => clearInterval(interval);
  }, []);

  const flames = [
    // Frame 0
    [
      "    🔥    ",
      "   🔥🔥   ",
      "  🟥🔥🟥  ",
      " 🟥🟧🟥🟥 ",
      "🟧🟧🟥🟧🟧",
    ],
    // Frame 1
    [
      "   🔥🔥   ",
      "  🔥🔥🔥  ",
      " 🟥🔥🟥🟥 ",
      "🟥🟧🟧🟥🟧",
      "🟧🟧🟧🟧🟧",
    ],
    // Frame 2
    [
      "  🔥      ",
      "   🔥🔥   ",
      "  🟥🔥🟥  ",
      "🟥🟧🟥🟧🟥",
      "🟧🟧🟧🟧🟧",
    ],
  ];

  return (
    <div style={{
      fontFamily: "monospace",
      fontSize: `${size / 6}px`,
      lineHeight: 1.1,
      textAlign: "center",
      filter: "drop-shadow(0 0 8px rgba(255,100,0,0.6))",
    }}>
      {flames[frame].map((line, i) => (
        <div key={i}>{line}</div>
      ))}
    </div>
  );
}

              fontFamily: PIXEL_FONT,
              fontSize: "9px",
              color: COLORS.textGold,
              letterSpacing: "4px",
              animation: "fadeIn 4s ease-out",
              marginBottom: "32px",
            }}>
              - F I N -
            </div>

            <div
              onClick={() => {
                setEndingStep(0);
                setScene(SCENES.TITLE);
              }}
              style={{
                fontFamily: PIXEL_FONT,
                fontSize: "9px",
                color: COLORS.textBlue,
                cursor: "pointer",
                padding: "10px 20px",
                border: `1px solid ${COLORS.windowBorderInner}`,
                borderRadius: "8px",
                background: "rgba(255,255,255,0.03)",
              }}
            >
              ▶ タイトルに もどる
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Battle screen (main menu)
  return (
    <div style={styles.container}>
      <style>{globalStyles}</style>
      <div style={styles.innerContainer}>
        {/* Monster area */}
        <div style={{
          flex: 1,
          display: "flex",
          flexDirection: "column",
          alignItems: "center",
          justifyContent: "center",
          minHeight: "180px",
          background: "linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 40%, #2a1a0e 80%, #1a0a0a 100%)",
          borderRadius: "12px",
          marginBottom: "12px",
          padding: "20px",
          position: "relative",
          overflow: "hidden",
        }}>
          {/* Stars */}
          {[...Array(20)].map((_, i) => (
            <div
              key={i}
              style={{
                position: "absolute",
                width: "2px",
                height: "2px",
                background: COLORS.text,
                borderRadius: "50%",
                top: `${Math.random() * 60}%`,
                left: `${Math.random() * 100}%`,
                opacity: Math.random() * 0.8 + 0.2,
                animation: `twinkle ${1 + Math.random() * 2}s infinite alternate`,
              }}
            />
          ))}
          <MonsterSprite />
        </div>

        {/* Message window */}
        <DQWindow style={{ marginBottom: "12px", minHeight: "60px" }} animate={false}>
          <div style={{ fontFamily: PIXEL_FONT, fontSize: "10px", color: COLORS.text, lineHeight: 2.2 }}>
            <TypeWriter
              text="2026年6月21日（日） 侍ジャパン第2戦 チュニジアを喰らう観戦懇親会。 コマンドを選んでください。"
              speed={30}
              key={scene}
            />
          </div>
        </DQWindow>

        {/* Command window */}
        <DQWindow title="コマンド" animate={false}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px" }}>
            {commands.map((cmd, i) => (
              <div
                key={i}
                onClick={cmd.action}
                onMouseEnter={() => setSelectedCmd(i)}
                style={{
                  fontFamily: PIXEL_FONT,
                  fontSize: "11px",
                  color: selectedCmd === i ? COLORS.textGold : COLORS.text,
                  cursor: "pointer",
                  padding: "10px 8px",
                  display: "flex",
                  alignItems: "center",
                  gap: "4px",
                  borderRadius: "6px",
                  background: selectedCmd === i ? "rgba(255,255,255,0.05)" : "transparent",
                  transition: "all 0.15s",
                }}
              >
                {selectedCmd === i && <CommandCursor />}
                {cmd.label}
              </div>
            ))}
          </div>
        </DQWindow>

        {/* Footer */}
        <div style={{
          textAlign: "center",
          marginTop: "12px",
          fontFamily: PIXEL_FONT,
          fontSize: "7px",
          color: "rgba(255,255,255,0.3)",
          letterSpacing: "1px",
        }}>
          長谷部
        </div>
      </div>
    </div>
  );
}

const styles = {
  container: {
    width: "100%",
    minHeight: "100vh",
    background: `linear-gradient(135deg, ${COLORS.bg} 0%, #0f0f3d 50%, #1a0a2e 100%)`,
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    padding: "16px",
    boxSizing: "border-box",
  },
  titleScreen: {
    display: "flex",
    flexDirection: "column",
    alignItems: "center",
    justifyContent: "center",
    minHeight: "80vh",
    position: "relative",
    animation: "fadeIn 0.5s ease-out",
  },
  innerContainer: {
    width: "100%",
    maxWidth: "420px",
    display: "flex",
    flexDirection: "column",
    animation: "fadeIn 0.3s ease-out",
  },
  backBtn: {
    fontFamily: PIXEL_FONT,
    fontSize: "10px",
    color: COLORS.textBlue,
    cursor: "pointer",
    textAlign: "center",
    padding: "12px",
    marginTop: "8px",
    border: `2px solid ${COLORS.windowBorderInner}`,
    borderRadius: "8px",
    background: "rgba(255,255,255,0.03)",
  },
  yesNoBtn: {
    fontFamily: PIXEL_FONT,
    fontSize: "11px",
    color: COLORS.text,
    cursor: "pointer",
    padding: "10px 20px",
    border: `2px solid ${COLORS.windowBorder}`,
    borderRadius: "8px",
    background: "rgba(255,255,255,0.05)",
  },
};

const globalStyles = `
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
  }

  @keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
  }

  * {
    -webkit-font-smoothing: none;
    -moz-osx-font-smoothing: unset;
    image-rendering: pixelated;
  }
`;


ReactDOM.createRoot(document.getElementById("root")).render(<TunisiaQuestFlyer />);
</script>
</body>
